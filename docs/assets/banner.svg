<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
<title id="title">ScreenInk — Turn your screen into a teaching canvas</title><desc id="desc">A dark blue banner with colorful pen strokes and a simple annotated fraction lesson.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#202c47"/></linearGradient></defs>
<rect width="1440" height="480" rx="24" fill="url(#bg)"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="92" y="96" fill="#94b3ff" font-size="17" letter-spacing="4">DRAW. EXPLAIN. SHARE.</text>
<text x="86" y="197" fill="#f3f6ff" font-size="82" font-weight="700">ScreenInk</text>
<text x="92" y="256" fill="#d9e3fa" font-size="29">Your screen. Your teaching canvas.</text>
<text x="92" y="306" fill="#b9c7e1" font-size="20">Press F8, draw your idea, and get back to presenting.</text>
<rect x="92" y="355" width="92" height="42" rx="11" fill="#94b3ff"/><text x="117" y="384" fill="#101827" font-size="23" font-weight="700">F8</text>
<text x="205" y="383" fill="#d9e3fa" font-size="18">Windows 10 / 11 · Portable · Works offline</text>
<g transform="translate(842 92) rotate(-3 240 145)"><rect width="490" height="292" rx="20" fill="#f6f8fc"/>
<circle cx="28" cy="25" r="5" fill="#f56477"/><circle cx="46" cy="25" r="5" fill="#ffd343"/><circle cx="64" cy="25" r="5" fill="#59d6b0"/>
<text x="34" y="82" fill="#192133" font-size="23" font-weight="700">Make the idea visible.</text>
<path d="M40 119 Q110 92 184 121 T316 116 T441 127" fill="none" stroke="#73a0ff" stroke-width="7" stroke-linecap="round"/>
<rect x="38" y="168" width="174" height="56" rx="7" fill="none" stroke="#73a0ff" stroke-width="3"/>
<text x="52" y="203" fill="#192133" font-size="21">3 / 4 = 75%</text><path d="M47 205 L196 205" stroke="#ffd343" stroke-width="18" opacity=".55"/>
<path d="M242 197 Q280 159 330 197" fill="none" stroke="#f56477" stroke-width="5" stroke-linecap="round"/><path d="M315 181 L331 198 L310 200" fill="none" stroke="#f56477" stroke-width="5" stroke-linejoin="round"/>
<text x="343" y="204" fill="#192133" font-size="21">Explain</text><text x="38" y="260" fill="#52617b" font-size="15">Pen · Highlighter · Shapes · Save PNG</text></g></g></svg>
